name: Fetch Raw Upstream Data
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run fetcher
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python fetch_simple.py
      - name: Commit archives and state
        run: |
          git config user.name "fetcher-bot"
          git config user.email "bot@localhost"
          git add sync_state archive
          git diff --quiet && git diff --staged --quiet || git commit -m "archive update"
          git push
